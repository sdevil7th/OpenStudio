      <stop offset="0.34" stop-color="#b39950"/>
      <stop offset="0.68" stop-color="#765f31"/>
      <stop offset="1" stop-color="#3e321d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111814"/>

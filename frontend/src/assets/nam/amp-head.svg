<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" role="img" aria-label="Original OpenStudio amp head artwork">
  <defs>
    <linearGradient id="shell" x1="0" x2="0" y1="0" y2="1">

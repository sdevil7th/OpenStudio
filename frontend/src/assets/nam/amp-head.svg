      <stop offset="0.45" stop-color="#7d6735" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f0c96a" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="face" x1="0" x2="1" y1="0" y2="1">

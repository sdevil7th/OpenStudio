<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-label="Original OpenStudio pedal artwork">
  <defs>
    <linearGradient id="case" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#39413d"/>
      <stop offset="0.34" stop-color="#1e2421"/>
      <stop offset="0.72" stop-color="#0d0f0e"/>
      <stop offset="1" stop-color="#050605"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" x2="1">
      <stop offset="0" stop-color="#8ef5c2" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#f5c86a" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8ef5c2" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#181918"/>
      <stop offset="1" stop-color="#070807"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dbfff0"/>
      <stop offset="0.22" stop-color="#8ef5c2"/>
      <stop offset="0.6" stop-color="#45b36b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#45b36b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-14%" y="-12%" width="128%" height="132%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" seed="29"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
    <pattern id="rubber" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10H20M10 0V20" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1.5"/>
      <path d="M-4 16L16 -4M4 24L24 4" stroke="#000" stroke-opacity="0.28" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect width="760" height="620" rx="42" fill="#050505"/>
  <ellipse cx="380" cy="566" rx="220" ry="30" fill="#000" opacity="0.5"/>
  <g filter="url(#shadow)">
    <rect x="154" y="52" width="452" height="504" rx="38" fill="url(#case)" stroke="url(#bevel)" stroke-width="3"/>
    <rect x="180" y="80" width="400" height="450" rx="28" fill="none" stroke="#fff" stroke-opacity="0.055" stroke-width="2"/>
    <rect x="206" y="112" width="348" height="142" rx="18" fill="#0d0f0e" stroke="#fff" stroke-opacity="0.08"/>
    <g fill="#10100e" stroke="#050505" stroke-width="10">
      <circle cx="274" cy="178" r="39"/>
      <circle cx="380" cy="178" r="39"/>
      <circle cx="486" cy="178" r="39"/>
    </g>
    <g fill="none" stroke="#ffd978" stroke-width="8" stroke-linecap="round">
      <circle cx="274" cy="178" r="33" stroke-dasharray="122 198" transform="rotate(-122 274 178)"/>
      <circle cx="380" cy="178" r="33" stroke-dasharray="150 198" transform="rotate(-136 380 178)"/>
      <circle cx="486" cy="178" r="33" stroke-dasharray="102 198" transform="rotate(-108 486 178)"/>
    </g>
    <g fill="#f8fafc">
      <rect x="271" y="144" width="6" height="19" rx="3" transform="rotate(-22 274 153)"/>
      <rect x="377" y="144" width="6" height="19" rx="3" transform="rotate(-34 380 153)"/>
      <rect x="483" y="144" width="6" height="19" rx="3" transform="rotate(-12 486 153)"/>
    </g>
    <circle cx="380" cy="296" r="42" fill="url(#lamp)"/>
    <circle cx="380" cy="296" r="11" fill="#8ef5c2"/>
    <rect x="210" y="356" width="340" height="126" rx="24" fill="url(#pad)" stroke="#fff" stroke-opacity="0.075"/>
    <rect x="210" y="356" width="340" height="126" rx="24" fill="url(#rubber)"/>
    <circle cx="380" cy="420" r="44" fill="#141515" stroke="#020202" stroke-width="10"/>
    <circle cx="380" cy="420" r="29" fill="none" stroke="#ffd978" stroke-opacity="0.55" stroke-width="7"/>
    <path d="M224 512H536" stroke="#ffd978" stroke-opacity="0.25" stroke-width="7" stroke-linecap="round"/>
    <g fill="#ffd978">
      <circle cx="204" cy="104" r="6" opacity="0.45"/>
      <circle cx="556" cy="104" r="6" opacity="0.45"/>
      <circle cx="204" cy="514" r="6" opacity="0.26"/>
      <circle cx="556" cy="514" r="6" opacity="0.26"/>
    </g>
    <rect x="154" y="52" width="452" height="504" rx="38" fill="url(#grain)"/>
  </g>
</svg>

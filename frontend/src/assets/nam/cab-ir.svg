<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-label="Original OpenStudio cabinet artwork">
  <defs>
    <linearGradient id="box" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#343432"/>
      <stop offset="0.38" stop-color="#191918"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" x2="1">
      <stop offset="0" stop-color="#f5c86a" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#6f5f35" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f5c86a" stop-opacity="0.24"/>
    </linearGradient>
    <radialGradient id="cone" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#40341d"/>
      <stop offset="0.28" stop-color="#17140e"/>
      <stop offset="0.5" stop-color="#090807"/>
      <stop offset="0.52" stop-color="#554729"/>
      <stop offset="1" stop-color="#070706"/>
    </radialGradient>
    <radialGradient id="room" cx="72%" cy="18%" r="64%">
      <stop offset="0" stop-color="#ffd978" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffd978" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="132%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000" flood-opacity="0.48"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="41"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.052"/>
      </feComponentTransfer>
    </filter>
    <pattern id="cloth" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10H20M10 0V20" stroke="#f5c86a" stroke-opacity="0.105" stroke-width="1.4"/>
      <path d="M0 0L20 20M20 0L0 20" stroke="#fff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="920" height="620" rx="46" fill="#050505"/>
  <ellipse cx="460" cy="566" rx="336" ry="32" fill="#000" opacity="0.48"/>
  <g filter="url(#shadow)">
    <rect x="82" y="62" width="756" height="492" rx="38" fill="url(#box)" stroke="url(#bevel)" stroke-width="3"/>
    <rect x="112" y="96" width="696" height="382" rx="25" fill="#11100e" stroke="#fff" stroke-opacity="0.085"/>
    <rect x="112" y="96" width="696" height="382" rx="25" fill="url(#cloth)"/>
    <rect x="112" y="96" width="696" height="382" rx="25" fill="url(#room)"/>
    <g opacity="0.92">
      <circle cx="306" cy="286" r="128" fill="url(#cone)" stroke="#000" stroke-width="12"/>
      <circle cx="614" cy="286" r="128" fill="url(#cone)" stroke="#000" stroke-width="12"/>
      <circle cx="306" cy="286" r="34" fill="#070706" stroke="#ffd978" stroke-opacity="0.24" stroke-width="5"/>
      <circle cx="614" cy="286" r="34" fill="#070706" stroke="#ffd978" stroke-opacity="0.24" stroke-width="5"/>
      <circle cx="306" cy="286" r="92" fill="none" stroke="#f5c86a" stroke-opacity="0.065" stroke-width="16"/>
      <circle cx="614" cy="286" r="92" fill="none" stroke="#f5c86a" stroke-opacity="0.065" stroke-width="16"/>
    </g>
    <g opacity="0.62">
      <path d="M182 500H738" stroke="#ffd978" stroke-opacity="0.25" stroke-width="7" stroke-linecap="round"/>
      <path d="M142 76h676" stroke="#fff" stroke-opacity="0.055" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g fill="#ffd978">
      <circle cx="128" cy="116" r="7" opacity="0.42"/>
      <circle cx="792" cy="116" r="7" opacity="0.42"/>
      <circle cx="128" cy="514" r="7" opacity="0.28"/>
      <circle cx="792" cy="514" r="7" opacity="0.28"/>
    </g>
    <rect x="82" y="62" width="756" height="492" rx="38" fill="url(#grain)"/>
  </g>
</svg>

name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-python-tools:
    name: Python tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run Python tooling unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

  verify-input-profiles:
    name: Input profiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run shortcut and input-profile browser tests
        run: npm run test:e2e

  verify-windows:
    runs-on: windows-latest
    env:
      VERSION: 0.0.0
      BUILD_DIR: build-verify-windows
      ASIO_SDK_DIR: thirdparty/asio
      ONNXRUNTIME_VERSION: 1.24.4
      ONNXRUNTIME_WIN_X64_SHA256: d2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install ASIO SDK
        shell: pwsh
        run: ./tools/setup-asio-sdk.ps1 -Destination $env:ASIO_SDK_DIR

      - name: Install ONNX Runtime
        shell: pwsh
        run: ./tools/setup-onnxruntime.ps1 -Version $env:ONNXRUNTIME_VERSION -ExpectedSha256 $env:ONNXRUNTIME_WIN_X64_SHA256

      - name: Install Windows prerequisite installers
        shell: pwsh
        run: |
          ./tools/setup-windows-prereqs.ps1

          function Invoke-PrerequisiteInstaller {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,

              [Parameter(Mandatory = $true)]
              [string[]]$Arguments,

              [Parameter(Mandatory = $true)]
              [string]$Name
            )

            if (-not (Test-Path -LiteralPath $Path)) {
              throw "$Name installer was not found at '$Path'."
            }

            $process = Start-Process -FilePath $Path -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010, 1638)) {
              Write-Warning "$Name installer exited with code $($process.ExitCode). Continuing so the startup self-test can report the actual runtime state."
            }
          }

          $prereqDir = Join-Path $env:GITHUB_WORKSPACE "thirdparty/windows-prereqs"
          Invoke-PrerequisiteInstaller `
            -Path (Join-Path $prereqDir "vc_redist.x64.exe") `
            -Arguments @("/install", "/quiet", "/norestart") `
            -Name "Visual C++ Redistributable"
          Invoke-PrerequisiteInstaller `
            -Path (Join-Path $prereqDir "MicrosoftEdgeWebView2RuntimeInstallerX64.exe") `
            -Arguments @("/silent", "/install") `
            -Name "Microsoft Edge WebView2 Runtime"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B $env:BUILD_DIR -A x64 `
            "-DOPENSTUDIO_APP_VERSION=$env:VERSION" `
            "-DJUCE_ASIOSDK_PATH=$env:GITHUB_WORKSPACE/$env:ASIO_SDK_DIR" `
            "-DOPENSTUDIO_REQUIRE_ASIO=ON" `
            "-DOPENSTUDIO_ENABLE_EXTERNAL_PYTHON_AI_FALLBACK=OFF" `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build OpenStudio
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --target OpenStudio

      - name: Validate Windows runtime bundle
        shell: pwsh
        run: ./tools/validate-runtime-bundle.ps1 -Platform windows -BundlePath "$env:BUILD_DIR/OpenStudio_artefacts/Release" -ExpectedVersion $env:VERSION -EnforceLeanBundle

      - name: Run Windows startup self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "OpenStudio_StartupSelfTest.txt"
          if (Test-Path $report) {
            Remove-Item -LiteralPath $report -Force -ErrorAction SilentlyContinue
          }

          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe"
          $process = Start-Process -FilePath $exePath -ArgumentList @("--startup-self-test", "--report", "`"$report`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $report) {
              Get-Content -LiteralPath $report
            } else {
              Write-Host "No self-test report was written."
              $startupLog = Join-Path $env:APPDATA "OpenStudio/logs/OpenStudio_Startup.log"
              if (Test-Path $startupLog) {
                Get-Content -LiteralPath $startupLog
              }
            }
            throw "Windows startup self-test failed."
          }

      - name: Regress WebView2 preflight from a non-writable install directory
        shell: pwsh
        run: |
          $sourceBundle = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release"
          $protectedBundle = Join-Path $env:RUNNER_TEMP "OpenStudio-Protected-Install"
          Copy-Item -LiteralPath $sourceBundle -Destination $protectedBundle -Recurse

          # Model Program Files precisely: the test identity may read and
          # execute the bundle but may not write beside OpenStudio.exe.
          $acl = New-Object System.Security.AccessControl.DirectorySecurity
          $acl.SetAccessRuleProtection($true, $false)
          $inheritance = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          $none = [System.Security.AccessControl.PropagationFlags]::None
          $allow = [System.Security.AccessControl.AccessControlType]::Allow
          $deny = [System.Security.AccessControl.AccessControlType]::Deny
          $currentUser = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          # GitHub-hosted Windows runners execute as an administrator. An explicit
          # user deny keeps the probe non-writable while the Administrators group
          # retains the delete and ACL rights needed for runner cleanup.
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
            $currentUser, 'Write', $inheritance, $none, $deny)))
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
            $currentUser, 'ReadAndExecute, Synchronize', $inheritance, $none, $allow)))
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
            'NT AUTHORITY\SYSTEM', 'FullControl', $inheritance, $none, $allow)))
          $acl.AddAccessRule((New-Object System.Security.AccessControl.FileSystemAccessRule(
            'BUILTIN\Administrators', 'FullControl', $inheritance, $none, $allow)))
          Set-Acl -LiteralPath $protectedBundle -AclObject $acl

          $writeProbe = Join-Path $protectedBundle 'must-not-write.tmp'
          $writeDenied = $false
          try {
            [System.IO.File]::WriteAllText($writeProbe, 'probe')
          } catch [System.UnauthorizedAccessException] {
            $writeDenied = $true
          }
          if ((Test-Path -LiteralPath $writeProbe) -or -not $writeDenied) {
            throw "Staged install directory remained writable."
          }

          $report = Join-Path $env:RUNNER_TEMP "OpenStudio_ProtectedInstallStartupSelfTest.txt"
          $exePath = Join-Path $protectedBundle "OpenStudio.exe"
          $process = Start-Process -FilePath $exePath -ArgumentList @("--startup-self-test", "--report", "`"$report`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $report) {
              Get-Content -LiteralPath $report
            }
            throw "WebView2 preflight failed from a non-writable install directory."
          }

          $reportText = [System.IO.File]::ReadAllText($report)
          $userDataMatch = [regex]::Match($reportText, '(?m)^webView2UserDataPath=(.+)$')
          if (-not $userDataMatch.Success) {
            throw "Protected-install self-test did not report its WebView2 user-data folder."
          }
          $userDataPath = [System.IO.Path]::GetFullPath($userDataMatch.Groups[1].Value.Trim())
          $protectedRoot = [System.IO.Path]::GetFullPath($protectedBundle).TrimEnd('\') + '\'
          if ($userDataPath.StartsWith($protectedRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "WebView2 user data incorrectly resolves inside the protected install tree: $userDataPath"
          }

      - name: Run Windows native-window lifecycle smoke test
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe"
          $report = Join-Path $env:RUNNER_TEMP "OpenStudio_WindowLifecycleHarness.json"
          ./tools/run-window-lifecycle-smoke.ps1 -AppPath $exePath -ReportPath $report -TimeoutSeconds 180

      - name: Run NAM Rack deterministic regression
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe"
          ./tools/run-nam-rack-headless-regression.ps1 `
            -AppPath $exePath `
            -OutputRoot $env:RUNNER_TEMP `
            -Label "ci-release" `
            -TimeoutSeconds 360 `
            -SkipBuild

  verify-macos:
    name: macOS native windows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    env:
      VERSION: 0.0.0
      BUILD_DIR: build-verify-macos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B "$BUILD_DIR" \
            -DOPENSTUDIO_APP_VERSION="$VERSION" \
            -DOPENSTUDIO_ENABLE_EXTERNAL_PYTHON_AI_FALLBACK=OFF \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build OpenStudio
        shell: bash
        run: cmake --build "$BUILD_DIR" --config Release --target OpenStudio

      - name: Find app bundle
        shell: bash
        run: |
          APP_BUNDLE="$(find "$BUILD_DIR" -name OpenStudio.app -type d -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "OpenStudio.app not found under $BUILD_DIR" >&2
            exit 1
          fi
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"

      - name: Validate macOS runtime bundle
        shell: pwsh
        run: ./tools/validate-runtime-bundle.ps1 -Platform macos -BundlePath "$env:APP_BUNDLE" -ExpectedVersion "$env:VERSION" -EnforceLeanBundle

      - name: Validate universal macOS executable
        shell: bash
        run: |
          ARCHS="$(lipo -archs "$APP_BUNDLE/Contents/MacOS/OpenStudio")"
          echo "OpenStudio architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]

      - name: Run macOS startup self-test
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/OpenStudio_StartupSelfTest.txt"
          "$APP_BUNDLE/Contents/MacOS/OpenStudio" --startup-self-test --report "$REPORT"
          if [ $? -ne 0 ]; then
            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            fi
            exit 1
          fi

      - name: Run macOS native-window lifecycle smoke test
        shell: pwsh
        run: |
          $executable = Join-Path $env:APP_BUNDLE "Contents/MacOS/OpenStudio"
          $report = Join-Path $env:RUNNER_TEMP "OpenStudio_WindowLifecycleHarness.json"
          ./tools/run-window-lifecycle-smoke.ps1 -AppPath $executable -ReportPath $report -TimeoutSeconds 180

  verify-linux:
    runs-on: ubuntu-24.04
    env:
      VERSION: 0.0.0
      BUILD_DIR: build-verify-linux
      ONNXRUNTIME_VERSION: 1.24.4
      ONNXRUNTIME_LINUX_X64_SHA256: 3a211fbea252c1e66290658f1b735b772056149f28321e71c308942cdb54b747
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install system dependencies
        shell: bash
        run: |
          bash ./tools/setup-linux-prereqs.sh
          sudo apt-get install -y xvfb

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Download ONNX Runtime
        shell: bash
        run: |
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          wget -q "$URL" -O onnxruntime.tgz
          echo "${ONNXRUNTIME_LINUX_X64_SHA256}  onnxruntime.tgz" | sha256sum --check --strict
          mkdir -p thirdparty/onnxruntime
          tar -xzf onnxruntime.tgz --strip-components=1 -C thirdparty/onnxruntime

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSTUDIO_APP_VERSION="$VERSION" \
            -DOPENSTUDIO_UPDATE_MANIFEST_URL_VALUE="https://openstudio.org.in/releases/stable/latest.json" \
            -DOPENSTUDIO_UPDATE_APPCAST_URL_VALUE="https://openstudio.org.in/appcast/linux-stable.xml" \
            -DOPENSTUDIO_RELEASES_PAGE_URL_VALUE="https://openstudio.org.in/download" \
            -DOPENSTUDIO_UPDATE_CHANNEL_VALUE="stable" \
            -DOPENSTUDIO_ENABLE_EXTERNAL_PYTHON_AI_FALLBACK=OFF \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build OpenStudio
        shell: bash
        run: cmake --build "$BUILD_DIR" --config Release --target OpenStudio

      - name: Validate Linux runtime bundle
        shell: pwsh
        run: ./tools/validate-runtime-bundle.ps1 -Platform linux -BundlePath "$env:BUILD_DIR/OpenStudio_artefacts/Release" -ExpectedVersion $env:VERSION -EnforceLeanBundle

      - name: Run Linux startup self-test
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/OpenStudio_StartupSelfTest.txt"
          xvfb-run -a "$BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio" --startup-self-test --report "$REPORT"
          if [ $? -ne 0 ]; then
            if [ -f "$REPORT" ]; then
              cat "$REPORT"
            fi
            exit 1
          fi

      - name: Package AppImage
        shell: bash
        run: |
          chmod +x ./tools/package-linux-release.sh
          bash ./tools/package-linux-release.sh "$VERSION" "$BUILD_DIR"

      - name: Verify Linux AppImage output
        shell: bash
        run: test -f "dist/linux/OpenStudio-${VERSION}-linux-x86_64.AppImage"

      - name: Validate packaged Linux AppImage contents
        shell: bash
        run: |
          APPIMAGE="$GITHUB_WORKSPACE/dist/linux/OpenStudio-${VERSION}-linux-x86_64.AppImage"
          EXTRACT_ROOT="$(mktemp -d)"
          cleanup() { rm -rf -- "$EXTRACT_ROOT"; }
          trap cleanup EXIT
          chmod +x "$APPIMAGE"
          (
            cd "$EXTRACT_ROOT"
            "$APPIMAGE" --appimage-extract >/dev/null
          )
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/tools/validate-runtime-bundle.ps1" \
            -Platform linux \
            -BundlePath "$EXTRACT_ROOT/squashfs-root/usr/bin" \
            -ExpectedVersion "$VERSION" \
            -EnforceLeanBundle

name: Certification access inspection (no publication)
on:
  push:
    branches: ['codex/certification-0.1.09-**']
    paths:
      - '.github/workflows/certification-access.yml'
      - 'tools/check-certification-access.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1
      - name: Inspect allowlisted credential presence without exposing values
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python3 tools/check-certification-access.py apple --report output/apple-access.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-certification-access
          path: output/apple-access.json
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: microsoft-store
    concurrency:
      group: openstudio-microsoft-store-submission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read Store identity and submission state without mutations
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: python3 tools/check-certification-access.py store --report output/store-access.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: store-certification-access
          path: output/store-access.json

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 1.0.0"
        required: true
      release_notes_file:
        description: "Path to a markdown file in the repo for release notes"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate-release-notes:
    runs-on: ubuntu-24.04
    outputs:
      notes_file: ${{ steps.notes.outputs.notes_file }}
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      NOTES_FILE: ${{ github.event.inputs.release_notes_file }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate exact-version release notes before building
        id: notes
        run: python3 tools/validate-release-notes.py --version "$VERSION" --notes-file "$NOTES_FILE" --github-output "$GITHUB_OUTPUT"

  build-windows:
    needs: validate-release-notes
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      WINDOWS_SIGNING_PROVIDER: ${{ vars.OPENSTUDIO_WINDOWS_SIGNING_PROVIDER || 'certificate' }}
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
      BUILD_DIR: build-release-windows
      ASIO_SDK_DIR: thirdparty/asio
      ONNXRUNTIME_VERSION: 1.24.4
      ONNXRUNTIME_WIN_X64_SHA256: d2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357
      AI_RUNTIME_VERSION: ${{ vars.OPENSTUDIO_AI_RUNTIME_VERSION != '' && vars.OPENSTUDIO_AI_RUNTIME_VERSION || github.event.inputs.version || github.ref_name }}
      AI_RUNTIME_STANDALONE_RELEASE_TAG: ${{ vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_RELEASE_TAG != '' && vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_RELEASE_TAG || '20260325' }}
      AI_RUNTIME_STANDALONE_PYTHON_VERSION: ${{ vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_PYTHON_VERSION != '' && vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_PYTHON_VERSION || '3.10.20' }}
      AI_RUNTIME_STANDALONE_FLAVOR: ${{ vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_FLAVOR != '' && vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_FLAVOR || 'install_only' }}
      RELEASE_SITE_URL: https://openstudio.org.in
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Windows signing configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if ($env:WINDOWS_SIGNING_PROVIDER -notin @('certificate', 'signpath')) {
            throw "OPENSTUDIO_WINDOWS_SIGNING_PROVIDER must be certificate or signpath."
          }
          if ($env:WINDOWS_SIGNING_PROVIDER -eq 'signpath') {
            foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG', 'SIGNPATH_SIGNING_POLICY_SLUG')) {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                throw "SignPath is enabled but $name is missing. See docs/release-runbook.md#windows-signing-with-signpath."
              }
            }
          }

      - name: Normalize version
        shell: pwsh
        run: |
          $version = "${env:VERSION}" -replace '^v', ''
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $aiRuntimeVersion = "${env:AI_RUNTIME_VERSION}" -replace '^v', ''
          "AI_RUNTIME_VERSION=$aiRuntimeVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: pwsh
        run: |
          cd frontend
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Install Windows prerequisite installers
        shell: pwsh
        run: ./tools/setup-windows-prereqs.ps1

      - name: Install ASIO SDK
        shell: pwsh
        run: ./tools/setup-asio-sdk.ps1 -Destination $env:ASIO_SDK_DIR

      - name: Install ONNX Runtime
        shell: pwsh
        run: ./tools/setup-onnxruntime.ps1 -Version $env:ONNXRUNTIME_VERSION -ExpectedSha256 $env:ONNXRUNTIME_WIN_X64_SHA256

      - name: Install checksum-pinned FFmpeg runtime
        shell: pwsh
        run: ./tools/setup-ffmpeg.ps1

      - name: Detect Doppler fallback
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          $configured = if ([string]::IsNullOrWhiteSpace($env:DOPPLER_TOKEN)) { "false" } else { "true" }
          "DOPPLER_CONFIGURED=$configured" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Doppler CLI
        if: env.DOPPLER_CONFIGURED == 'true'
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Configure CMake
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TONE3000_PUBLISHABLE_KEY: ${{ vars.TONE3000_PUBLISHABLE_KEY != '' && vars.TONE3000_PUBLISHABLE_KEY || secrets.TONE3000_PUBLISHABLE_KEY }}
          OPENSTUDIO_TONE3000_CLIENT_ID_VALUE: ${{ secrets.OPENSTUDIO_TONE3000_CLIENT_ID_VALUE }}
          OPENSTUDIO_TONE3000_CLIENT_ID: ${{ secrets.OPENSTUDIO_TONE3000_CLIENT_ID }}
        run: |
          function Get-AllowlistedDopplerValue {
            param([Parameter(Mandatory = $true)][string]$Name)
            if ([string]::IsNullOrWhiteSpace($env:DOPPLER_TOKEN)) { return "" }
            $value = (& doppler secrets get $Name --plain 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { return "" }
            if (-not [string]::IsNullOrWhiteSpace($value)) { Write-Host "::add-mask::$value" }
            return $value
          }

          $tone3000ClientId = $env:TONE3000_PUBLISHABLE_KEY
          if ([string]::IsNullOrWhiteSpace($tone3000ClientId)) {
            $tone3000ClientId = $env:OPENSTUDIO_TONE3000_CLIENT_ID_VALUE
          }
          if ([string]::IsNullOrWhiteSpace($tone3000ClientId)) {
            $tone3000ClientId = $env:OPENSTUDIO_TONE3000_CLIENT_ID
          }
          if ([string]::IsNullOrWhiteSpace($tone3000ClientId)) {
            foreach ($name in @("TONE3000_PUBLISHABLE_KEY", "OPENSTUDIO_TONE3000_CLIENT_ID_VALUE", "OPENSTUDIO_TONE3000_CLIENT_ID")) {
              $tone3000ClientId = Get-AllowlistedDopplerValue -Name $name
              if (-not [string]::IsNullOrWhiteSpace($tone3000ClientId)) { break }
            }
          }
          if ([string]::IsNullOrWhiteSpace($tone3000ClientId)) {
            throw "A TONE3000 publishable OAuth client ID is required for release builds."
          }
          $env:DOPPLER_TOKEN = ""
          $env:TONE3000_PUBLISHABLE_KEY = ""
          $env:OPENSTUDIO_TONE3000_CLIENT_ID_VALUE = ""
          $env:OPENSTUDIO_TONE3000_CLIENT_ID = ""

          cmake -S . -B $env:BUILD_DIR -A x64 `
            "-DOPENSTUDIO_APP_VERSION=$env:VERSION" `
            "-DOPENSTUDIO_UPDATE_MANIFEST_URL_VALUE=$env:RELEASE_SITE_URL/releases/stable/latest.json" `
            "-DOPENSTUDIO_UPDATE_APPCAST_URL_VALUE=$env:RELEASE_SITE_URL/appcast/windows-stable.xml" `
            "-DOPENSTUDIO_RELEASES_PAGE_URL_VALUE=$env:RELEASE_SITE_URL/download" `
            "-DOPENSTUDIO_UPDATE_CHANNEL_VALUE=stable" `
            "-DOPENSTUDIO_TONE3000_CLIENT_ID_VALUE=$tone3000ClientId" `
            "-DJUCE_ASIOSDK_PATH=$env:GITHUB_WORKSPACE/$env:ASIO_SDK_DIR" `
            "-DOPENSTUDIO_REQUIRE_ASIO=ON" `
            "-DOPENSTUDIO_ENABLE_EXTERNAL_PYTHON_AI_FALLBACK=OFF" `
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build OpenStudio
        shell: pwsh
        run: cmake --build $env:BUILD_DIR --config Release --target OpenStudio

      - name: Verify signed updater (Windows Release)
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe"
          $report = Join-Path $env:RUNNER_TEMP "updater-regression"
          $process = Start-Process -FilePath $exe -ArgumentList @("--updater-self-test", "`"$report`"") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Signed updater regression failed." }

      - name: Validate Windows runtime bundle
        shell: pwsh
        run: ./tools/validate-runtime-bundle.ps1 -Platform windows -BundlePath "$env:BUILD_DIR/OpenStudio_artefacts/Release" -ExpectedVersion $env:VERSION -EnforceLeanBundle

      - name: Run render and export release gate
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe"
          ./tools/run-render-export-headless-regression.ps1 `
            -AppPath $exePath `
            -OutputRoot $env:RUNNER_TEMP `
            -Label "release" `
            -TimeoutSeconds 180 `
            -SkipBuild

      - name: Run Windows native-window lifecycle release gate
        shell: pwsh
        run: |
          $exePath = Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe"
          $report = Join-Path $env:RUNNER_TEMP "OpenStudio_WindowLifecycleHarness.json"
          ./tools/run-window-lifecycle-smoke.ps1 -AppPath $exePath -ReportPath $report -TimeoutSeconds 180

      - name: Stage Windows payload for SignPath
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        shell: pwsh
        run: |
          . ./tools/windows-signing.ps1
          Copy-OpenStudioSigningFiles -SourceDirectory "$env:BUILD_DIR/OpenStudio_artefacts/Release" `
            -DestinationDirectory "$env:RUNNER_TEMP/signpath-payload-unsigned" -Version $env:VERSION -RequireEmptyDestination

      - name: Upload unsigned Windows payload
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        id: signpath-payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-payload-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-payload-unsigned/*
          if-no-files-found: error
          retention-days: 7

      - name: Sign Windows payload
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-payload
          github-artifact-id: ${{ steps.signpath-payload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath-payload-signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Verify and restore signed Windows payload
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        shell: pwsh
        run: |
          . ./tools/windows-signing.ps1
          Copy-OpenStudioSigningFiles -SourceDirectory "$env:RUNNER_TEMP/signpath-payload-signed" `
            -DestinationDirectory "$env:BUILD_DIR/OpenStudio_artefacts/Release" -Version $env:VERSION -RequireSignature

      - name: Prepare Windows signing certificate
        if: env.WINDOWS_SIGNING_PROVIDER == 'certificate'
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
        run: |
          $certificateBase64 = $env:WINDOWS_CODESIGN_CERT_BASE64
          if ([string]::IsNullOrWhiteSpace($certificateBase64) -and -not [string]::IsNullOrWhiteSpace($env:DOPPLER_TOKEN)) {
            $certificateBase64 = (& doppler secrets get WINDOWS_CODESIGN_CERT_BASE64 --plain 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { $certificateBase64 = "" }
          }
          $env:DOPPLER_TOKEN = ""
          $env:WINDOWS_CODESIGN_CERT_BASE64 = ""
          if ([string]::IsNullOrWhiteSpace($certificateBase64)) {
            Write-Host "No Windows code-signing certificate secret was provided."
            exit 0
          }
          Write-Host "::add-mask::$certificateBase64"

          $certPath = Join-Path $env:RUNNER_TEMP "openstudio-codesign.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($certificateBase64))
          "WINDOWS_CODESIGN_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Windows installer
        if: env.WINDOWS_SIGNING_PROVIDER == 'certificate'
        shell: pwsh
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CODESIGN_CERT_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          function Get-ReleaseValue {
            param([Parameter(Mandatory = $true)][string]$Name, [string]$DirectValue)
            if (-not [string]::IsNullOrWhiteSpace($DirectValue)) { return $DirectValue }
            if ([string]::IsNullOrWhiteSpace($env:DOPPLER_TOKEN)) { return "" }
            $value = (& doppler secrets get $Name --plain 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { return "" }
            if (-not [string]::IsNullOrWhiteSpace($value)) { Write-Host "::add-mask::$value" }
            return $value
          }

          $certificatePassword = Get-ReleaseValue -Name "WINDOWS_CODESIGN_CERT_PASSWORD" -DirectValue $env:WINDOWS_CODESIGN_CERT_PASSWORD
          $certificateThumbprint = Get-ReleaseValue -Name "WINDOWS_CODESIGN_CERT_THUMBPRINT" -DirectValue $env:WINDOWS_CODESIGN_CERT_THUMBPRINT
          $timestampUrl = Get-ReleaseValue -Name "WINDOWS_TIMESTAMP_URL" -DirectValue $env:WINDOWS_TIMESTAMP_URL
          $env:DOPPLER_TOKEN = ""
          $env:WINDOWS_CODESIGN_CERT_PASSWORD = ""
          $env:WINDOWS_CODESIGN_CERT_THUMBPRINT = ""
          $env:WINDOWS_TIMESTAMP_URL = ""
          $arguments = @{
            Version = $env:VERSION
            NotesFile = $env:RELEASE_NOTES_FILE
            SourceDir = "$env:BUILD_DIR/OpenStudio_artefacts/Release"
          }

          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_PATH)) {
            $arguments.CertificateFile = $env:WINDOWS_CODESIGN_CERT_PATH
          }

          if (-not [string]::IsNullOrWhiteSpace($certificatePassword)) {
            $arguments.CertificatePassword = $certificatePassword
          }

          if (-not [string]::IsNullOrWhiteSpace($certificateThumbprint)) {
            $arguments.CertificateThumbprint = $certificateThumbprint
          }

          if (-not [string]::IsNullOrWhiteSpace($timestampUrl)) {
            $arguments.TimestampUrl = $timestampUrl
          }

          ./tools/package-windows-release.ps1 @arguments

      - name: Package Windows installer with signed payload
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        shell: pwsh
        run: |
          ./tools/package-windows-release.ps1 -Version $env:VERSION -NotesFile $env:RELEASE_NOTES_FILE `
            -SourceDir "$env:BUILD_DIR/OpenStudio_artefacts/Release" -RequireSignedPayload
          . ./tools/windows-signing.ps1
          Copy-OpenStudioSigningFiles -SourceDirectory "dist/windows" -Kind installer `
            -DestinationDirectory "$env:RUNNER_TEMP/signpath-installer-unsigned" -Version $env:VERSION -RequireEmptyDestination

      - name: Upload unsigned Windows installer
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        id: signpath-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-installer-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-installer-unsigned/*
          if-no-files-found: error
          retention-days: 7

      - name: Sign Windows installer
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.signpath-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ runner.temp }}/signpath-installer-signed
          parameters: |
            version: ${{ toJSON(env.VERSION) }}

      - name: Verify and restore signed Windows installer
        if: env.WINDOWS_SIGNING_PROVIDER == 'signpath'
        shell: pwsh
        run: |
          . ./tools/windows-signing.ps1
          Copy-OpenStudioSigningFiles -SourceDirectory "$env:RUNNER_TEMP/signpath-installer-signed" -Kind installer `
            -DestinationDirectory "dist/windows" -Version $env:VERSION -RequireSignature
          Assert-OpenStudioSigningFiles -Directory "$env:BUILD_DIR/OpenStudio_artefacts/Release" `
            -Version $env:VERSION -RequireSignature

      - name: Verify Windows release outputs
        shell: pwsh
        run: |
          $requiredFiles = @(
            "$env:BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.exe",
            "dist/windows/OpenStudio-Setup-x64.exe"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              throw "Required Windows release file missing: $file"
            }
          }

      - name: Stage checksum-pinned FFmpeg corresponding source
        shell: pwsh
        run: ./tools/setup-ffmpeg.ps1 -CorrespondingSourceDestination "dist/windows/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip"

      - name: Build validated Microsoft Store package
        # Always retain a tag-built MSIX for the first manual Store submission.
        # OPENSTUDIO_STORE_ENABLED gates only the credentialed submit-store job.
        shell: pwsh
        env:
          RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
        run: |
          $storeVersion = python tools/submit_store_release.py --version $env:VERSION --print-package-version
          if ($LASTEXITCODE -ne 0) { throw 'Invalid Store release version.' }
          ./tools/package-windows-store.ps1 -Version $storeVersion -NotesFile $env:RELEASE_NOTES_FILE `
            -SourceDir "$env:BUILD_DIR/OpenStudio_artefacts/Release" -OutputDir dist/store
          python tools/submit_store_release.py --version $env:VERSION --package-dir dist/store `
            --notes-file $env:RELEASE_NOTES_FILE --report dist/store/validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Store submission preflight failed.' }

      - name: Retain Microsoft Store submission artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-package
          path: |
            dist/store/*.msix
            dist/store/package-report.json
            dist/store/validation.json
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            dist/windows/OpenStudio-Setup-x64.exe
            dist/windows/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip
          if-no-files-found: error

  build-macos:
    needs: validate-release-notes
    runs-on: macos-14
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
      BUILD_DIR: build-release-macos
      AI_RUNTIME_VERSION: ${{ vars.OPENSTUDIO_AI_RUNTIME_VERSION != '' && vars.OPENSTUDIO_AI_RUNTIME_VERSION || github.event.inputs.version || github.ref_name }}
      AI_RUNTIME_STANDALONE_RELEASE_TAG: ${{ vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_RELEASE_TAG != '' && vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_RELEASE_TAG || '20260325' }}
      AI_RUNTIME_STANDALONE_PYTHON_VERSION: ${{ vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_PYTHON_VERSION != '' && vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_PYTHON_VERSION || '3.10.20' }}
      AI_RUNTIME_STANDALONE_FLAVOR: ${{ vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_FLAVOR != '' && vars.OPENSTUDIO_AI_RUNTIME_STANDALONE_FLAVOR || 'install_only' }}
      RELEASE_SITE_URL: https://openstudio.org.in
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Normalize version
        shell: bash
        run: |
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "AI_RUNTIME_VERSION=${AI_RUNTIME_VERSION#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Detect Doppler fallback
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [[ -n "${DOPPLER_TOKEN:-}" ]]; then
            echo "DOPPLER_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "DOPPLER_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Install Doppler CLI
        if: env.DOPPLER_CONFIGURED == 'true'
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Prepare macOS signing certificate
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          resolve_release_value() {
            local name="$1"
            local direct_value="${2:-}"
            if [[ -n "$direct_value" ]]; then printf '%s' "$direct_value"; return 0; fi
            if [[ -z "${DOPPLER_TOKEN:-}" ]]; then return 0; fi
            doppler secrets get "$name" --plain 2>/dev/null || true
          }

          CERTIFICATE_BASE64="$(resolve_release_value MACOS_CERTIFICATE_BASE64 "${MACOS_CERTIFICATE_BASE64:-}")"
          CERTIFICATE_PASSWORD="$(resolve_release_value MACOS_CERTIFICATE_PASSWORD "${MACOS_CERTIFICATE_PASSWORD:-}")"
          KEYCHAIN_PASSWORD="$(resolve_release_value MACOS_KEYCHAIN_PASSWORD "${MACOS_KEYCHAIN_PASSWORD:-}")"
          unset DOPPLER_TOKEN MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD
          if [[ -z "$CERTIFICATE_BASE64" ]]; then
            echo "No macOS code-signing certificate was provided."
            exit 0
          fi
          if [[ -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "A macOS certificate requires both certificate and keychain passwords." >&2
            exit 1
          fi
          echo "::add-mask::$CERTIFICATE_BASE64"
          echo "::add-mask::$CERTIFICATE_PASSWORD"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          CERT_PATH="$RUNNER_TEMP/openstudio-macos-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/openstudio-signing.keychain-db"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | sed 's/^[[:space:]]*//; s/^\"//; s/\"$//')"

          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcrun
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Configure CMake
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TONE3000_PUBLISHABLE_KEY: ${{ vars.TONE3000_PUBLISHABLE_KEY != '' && vars.TONE3000_PUBLISHABLE_KEY || secrets.TONE3000_PUBLISHABLE_KEY }}
          OPENSTUDIO_TONE3000_CLIENT_ID_VALUE: ${{ secrets.OPENSTUDIO_TONE3000_CLIENT_ID_VALUE }}
          OPENSTUDIO_TONE3000_CLIENT_ID: ${{ secrets.OPENSTUDIO_TONE3000_CLIENT_ID }}
        run: |
          resolve_doppler_value() {
            local name="$1"
            if [[ -z "${DOPPLER_TOKEN:-}" ]]; then return 0; fi
            doppler secrets get "$name" --plain 2>/dev/null || true
          }

          TONE3000_CLIENT_ID="${TONE3000_PUBLISHABLE_KEY:-${OPENSTUDIO_TONE3000_CLIENT_ID_VALUE:-${OPENSTUDIO_TONE3000_CLIENT_ID:-}}}"
          if [[ -z "$TONE3000_CLIENT_ID" ]]; then
            for name in TONE3000_PUBLISHABLE_KEY OPENSTUDIO_TONE3000_CLIENT_ID_VALUE OPENSTUDIO_TONE3000_CLIENT_ID; do
              TONE3000_CLIENT_ID="$(resolve_doppler_value "$name")"
              if [[ -n "$TONE3000_CLIENT_ID" ]]; then
                echo "::add-mask::$TONE3000_CLIENT_ID"
                break
              fi
            done
          fi
          if [ -z "$TONE3000_CLIENT_ID" ]; then
            echo "A TONE3000 publishable OAuth client ID is required for release builds." >&2
            exit 1
          fi
          unset DOPPLER_TOKEN TONE3000_PUBLISHABLE_KEY OPENSTUDIO_TONE3000_CLIENT_ID_VALUE OPENSTUDIO_TONE3000_CLIENT_ID

          cmake -S . -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSTUDIO_APP_VERSION="$VERSION" \
            -DOPENSTUDIO_UPDATE_MANIFEST_URL_VALUE="$RELEASE_SITE_URL/releases/stable/latest.json" \
            -DOPENSTUDIO_UPDATE_APPCAST_URL_VALUE="$RELEASE_SITE_URL/appcast/macos-stable.xml" \
            -DOPENSTUDIO_RELEASES_PAGE_URL_VALUE="$RELEASE_SITE_URL/download" \
            -DOPENSTUDIO_UPDATE_CHANNEL_VALUE="stable" \
            -DOPENSTUDIO_TONE3000_CLIENT_ID_VALUE="$TONE3000_CLIENT_ID" \
            -DOPENSTUDIO_ENABLE_EXTERNAL_PYTHON_AI_FALLBACK=OFF \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build OpenStudio
        shell: bash
        run: cmake --build "$BUILD_DIR" --config Release --target OpenStudio

      - name: Verify signed updater (macOS Release)
        shell: bash
        run: |
          "$BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.app/Contents/MacOS/OpenStudio" --updater-self-test "$RUNNER_TEMP/updater-regression"
          "$BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio.app/Contents/Helpers/OpenStudioUpdateInstaller" --self-test "$HOME/updater-installer-regression"

      - name: Validate macOS runtime bundle
        shell: pwsh
        run: |
          $appPath = Get-ChildItem -Path $env:BUILD_DIR -Recurse -Directory -Filter OpenStudio.app | Select-Object -First 1
          if (-not $appPath) {
            throw "OpenStudio.app was not found in the build output."
          }

          ./tools/validate-runtime-bundle.ps1 -Platform macos -BundlePath $appPath.FullName -ExpectedVersion $env:VERSION -EnforceLeanBundle

      - name: Validate universal macOS executable
        shell: bash
        run: |
          APP_PATH="$(find "$BUILD_DIR" -type d -name 'OpenStudio.app' | head -n 1)"
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/OpenStudio")"
          echo "OpenStudio architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]]
          [[ " $ARCHS " == *" x86_64 "* ]]

      - name: Package macOS DMG
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          resolve_release_value() {
            local name="$1"
            local direct_value="${2:-}"
            if [[ -n "$direct_value" ]]; then printf '%s' "$direct_value"; return 0; fi
            if [[ -z "${DOPPLER_TOKEN:-}" ]]; then return 0; fi
            doppler secrets get "$name" --plain 2>/dev/null || true
          }

          export MACOS_CODESIGN_IDENTITY="$(resolve_release_value MACOS_CODESIGN_IDENTITY "${MACOS_CODESIGN_IDENTITY:-}")"
          export APPLE_ID="$(resolve_release_value APPLE_ID "${APPLE_ID:-}")"
          export APPLE_TEAM_ID="$(resolve_release_value APPLE_TEAM_ID "${APPLE_TEAM_ID:-}")"
          export APPLE_APP_PASSWORD="$(resolve_release_value APPLE_APP_PASSWORD "${APPLE_APP_PASSWORD:-}")"
          for value in "$MACOS_CODESIGN_IDENTITY" "$APPLE_ID" "$APPLE_TEAM_ID" "$APPLE_APP_PASSWORD"; do
            if [[ -n "$value" ]]; then echo "::add-mask::$value"; fi
          done
          unset DOPPLER_TOKEN

          chmod +x ./tools/package-macos-release.sh
          APP_PATH="$(find "$BUILD_DIR" -type d -name 'OpenStudio.app' | head -n 1)"
          if [[ -z "$APP_PATH" ]]; then
            echo "OpenStudio.app was not found in the build output." >&2
            exit 1
          fi
          ./tools/package-macos-release.sh "$APP_PATH" "$VERSION" dist/macos "$RELEASE_NOTES_FILE"
          if [[ -n "$MACOS_CODESIGN_IDENTITY" ]]; then
            echo "OPENSTUDIO_MACOS_PACKAGE_SIGNED=true" >> "$GITHUB_ENV"
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            echo "OPENSTUDIO_MACOS_PACKAGE_NOTARIZED=true" >> "$GITHUB_ENV"
          fi

      - name: Run packaged macOS native-window lifecycle release gate
        shell: bash
        run: |
          MOUNT_DIR="$(mktemp -d)"
          REPORT_PATH="$RUNNER_TEMP/OpenStudio_PackagedWindowLifecycleHarness.json"
          cleanup() {
            hdiutil detach "$MOUNT_DIR" -quiet || true
            rmdir "$MOUNT_DIR" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "dist/macos/OpenStudio-macOS.dmg" -nobrowse -readonly -mountpoint "$MOUNT_DIR"
          APP_PATH="$MOUNT_DIR/OpenStudio.app"
          test -x "$APP_PATH/Contents/MacOS/OpenStudio"

          if [[ "${OPENSTUDIO_MACOS_PACKAGE_SIGNED:-false}" == "true" ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          fi

          if [[ "${OPENSTUDIO_MACOS_PACKAGE_NOTARIZED:-false}" == "true" ]]; then
            spctl --assess --type execute --verbose=2 "$APP_PATH"
          fi

          pwsh -NoProfile -File ./tools/run-window-lifecycle-smoke.ps1 \
            -AppPath "$APP_PATH/Contents/MacOS/OpenStudio" \
            -ReportPath "$REPORT_PATH" \
            -TimeoutSeconds 180

      - name: Verify macOS release outputs
        shell: bash
        run: |
          test -f "dist/macos/OpenStudio-macOS.dmg"

      - name: Clean up macOS signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        shell: bash
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: dist/macos/OpenStudio-macOS.dmg
          if-no-files-found: error

  build-linux:
    needs: validate-release-notes
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
      BUILD_DIR: build-release-linux
      ONNXRUNTIME_VERSION: 1.24.4
      ONNXRUNTIME_LINUX_X64_SHA256: 3a211fbea252c1e66290658f1b735b772056149f28321e71c308942cdb54b747
      RELEASE_SITE_URL: https://openstudio.org.in
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Normalize version
        shell: bash
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libgl1-mesa-dev libfreetype6-dev libfontconfig1-dev \
            libcurl4-openssl-dev libsecret-tools \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Download ONNX Runtime (Linux CPU)
        run: |
          URL="https://github.com/microsoft/onnxruntime/releases/download/v${ONNXRUNTIME_VERSION}/onnxruntime-linux-x64-${ONNXRUNTIME_VERSION}.tgz"
          curl --fail --location --show-error --retry 3 --retry-delay 2 --output onnxruntime.tgz "$URL"
          echo "${ONNXRUNTIME_LINUX_X64_SHA256}  onnxruntime.tgz" | sha256sum --check --strict
          mkdir -p thirdparty/onnxruntime
          tar -xzf onnxruntime.tgz --strip-components=1 -C thirdparty/onnxruntime

      - name: Detect Doppler fallback
        shell: bash
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [[ -n "${DOPPLER_TOKEN:-}" ]]; then
            echo "DOPPLER_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "DOPPLER_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Install Doppler CLI
        if: env.DOPPLER_CONFIGURED == 'true'
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Configure CMake
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          TONE3000_PUBLISHABLE_KEY: ${{ vars.TONE3000_PUBLISHABLE_KEY != '' && vars.TONE3000_PUBLISHABLE_KEY || secrets.TONE3000_PUBLISHABLE_KEY }}
          OPENSTUDIO_TONE3000_CLIENT_ID_VALUE: ${{ secrets.OPENSTUDIO_TONE3000_CLIENT_ID_VALUE }}
          OPENSTUDIO_TONE3000_CLIENT_ID: ${{ secrets.OPENSTUDIO_TONE3000_CLIENT_ID }}
        run: |
          resolve_doppler_value() {
            local name="$1"
            if [[ -z "${DOPPLER_TOKEN:-}" ]]; then return 0; fi
            doppler secrets get "$name" --plain 2>/dev/null || true
          }

          TONE3000_CLIENT_ID="${TONE3000_PUBLISHABLE_KEY:-${OPENSTUDIO_TONE3000_CLIENT_ID_VALUE:-${OPENSTUDIO_TONE3000_CLIENT_ID:-}}}"
          if [[ -z "$TONE3000_CLIENT_ID" ]]; then
            for name in TONE3000_PUBLISHABLE_KEY OPENSTUDIO_TONE3000_CLIENT_ID_VALUE OPENSTUDIO_TONE3000_CLIENT_ID; do
              TONE3000_CLIENT_ID="$(resolve_doppler_value "$name")"
              if [[ -n "$TONE3000_CLIENT_ID" ]]; then
                echo "::add-mask::$TONE3000_CLIENT_ID"
                break
              fi
            done
          fi
          if [ -z "$TONE3000_CLIENT_ID" ]; then
            echo "A TONE3000 publishable OAuth client ID is required for release builds." >&2
            exit 1
          fi
          unset DOPPLER_TOKEN TONE3000_PUBLISHABLE_KEY OPENSTUDIO_TONE3000_CLIENT_ID_VALUE OPENSTUDIO_TONE3000_CLIENT_ID

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENSTUDIO_APP_VERSION="$VERSION" \
            -DOPENSTUDIO_UPDATE_MANIFEST_URL_VALUE="$RELEASE_SITE_URL/releases/stable/latest.json" \
            -DOPENSTUDIO_UPDATE_APPCAST_URL_VALUE="$RELEASE_SITE_URL/appcast/linux-stable.xml" \
            -DOPENSTUDIO_RELEASES_PAGE_URL_VALUE="$RELEASE_SITE_URL/download" \
            -DOPENSTUDIO_UPDATE_CHANNEL_VALUE="stable" \
            -DOPENSTUDIO_TONE3000_CLIENT_ID_VALUE="$TONE3000_CLIENT_ID" \
            -DOPENSTUDIO_ENABLE_EXTERNAL_PYTHON_AI_FALLBACK=OFF \
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON

      - name: Build OpenStudio
        run: cmake --build "$BUILD_DIR" --config Release --target OpenStudio

      - name: Verify signed updater (Linux Release)
        shell: bash
        run: |
          xvfb-run -a "$BUILD_DIR/OpenStudio_artefacts/Release/OpenStudio" --updater-self-test "$RUNNER_TEMP/updater-regression"
          "$BUILD_DIR/OpenStudio_artefacts/Release/OpenStudioUpdateInstaller" --self-test "$HOME/updater-installer-regression"

      - name: Validate Linux runtime bundle
        shell: pwsh
        run: ./tools/validate-runtime-bundle.ps1 -Platform linux -BundlePath "$env:BUILD_DIR/OpenStudio_artefacts/Release" -ExpectedVersion $env:VERSION -EnforceLeanBundle

      - name: Package AppImage
        run: |
          chmod +x ./tools/package-linux-release.sh
          bash ./tools/package-linux-release.sh "$VERSION" "$BUILD_DIR" "$RELEASE_NOTES_FILE"

      - name: Verify Linux release outputs
        run: test -f "dist/linux/OpenStudio-${VERSION}-linux-x86_64.AppImage"

      - name: Validate packaged Linux AppImage contents
        shell: bash
        run: |
          APPIMAGE="$GITHUB_WORKSPACE/dist/linux/OpenStudio-${VERSION}-linux-x86_64.AppImage"
          EXTRACT_ROOT="$(mktemp -d)"
          cleanup() { rm -rf -- "$EXTRACT_ROOT"; }
          trap cleanup EXIT
          chmod +x "$APPIMAGE"
          (
            cd "$EXTRACT_ROOT"
            "$APPIMAGE" --appimage-extract >/dev/null
          )
          pwsh -NoProfile -File "$GITHUB_WORKSPACE/tools/validate-runtime-bundle.ps1" \
            -Platform linux \
            -BundlePath "$EXTRACT_ROOT/squashfs-root/usr/bin" \
            -ExpectedVersion "$VERSION" \
            -EnforceLeanBundle

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-release
          path: dist/linux/OpenStudio-*-linux-x86_64.AppImage
          if-no-files-found: error

  preflight-store:
    name: Check Store readiness before publication
    needs: [build-windows, validate-release-notes]
    if: vars.OPENSTUDIO_STORE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: microsoft-store
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: microsoft-store-package
          path: dist/store
      - name: Require the exact release tag
        run: test "$GITHUB_REF_NAME" = "v${VERSION#v}"
      - name: Inspect Store readiness without changing the submission
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: >-
          python3 tools/submit_store_release.py --version "$VERSION"
          --package-dir dist/store --notes-file "$RELEASE_NOTES_FILE"
          --initial-submission-config packaging/msix/initial-submission.json
          --report output/store-prepublish.json --preflight
      - name: Retain sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-readiness-${{ github.run_attempt }}
          path: output/store-prepublish.json
          if-no-files-found: warn
          retention-days: 30

  publish:
    # A skipped Store gate is permitted only for releases where Store submission
    # is not enabled. Failed/cancelled builds or preflight must never publish.
    if: >-
      ${{ !cancelled() && needs.validate-release-notes.result == 'success'
          && needs.build-windows.result == 'success'
          && needs.build-macos.result == 'success'
          && needs.build-linux.result == 'success'
          && (needs.preflight-store.result == 'success'
              || (needs.preflight-store.result == 'skipped'
                  && (vars.OPENSTUDIO_STORE_ENABLED != 'true'
                      || !startsWith(github.ref, 'refs/tags/v')))) }}
    runs-on: ubuntu-latest
    needs:
      - validate-release-notes
      - build-windows
      - build-macos
      - build-linux
      - preflight-store
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
      AI_RUNTIME_VERSION: ${{ vars.OPENSTUDIO_AI_RUNTIME_VERSION != '' && vars.OPENSTUDIO_AI_RUNTIME_VERSION || github.event.inputs.version || github.ref_name }}
      AI_RUNTIME_RELEASE_TAG: ${{ vars.OPENSTUDIO_AI_RUNTIME_RELEASE_TAG }}
      WEBSITE_REPO: ${{ vars.OPENSTUDIO_WEBSITE_REPO != '' && vars.OPENSTUDIO_WEBSITE_REPO || 'sdevil7th/OpenStudioWebsite' }}
      WEBSITE_DISPATCH_EVENT_TYPE: ${{ vars.OPENSTUDIO_WEBSITE_DISPATCH_EVENT_TYPE != '' && vars.OPENSTUDIO_WEBSITE_DISPATCH_EVENT_TYPE || 'openstudio_release_published' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Normalize version
        shell: bash
        run: |
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "AI_RUNTIME_VERSION=${AI_RUNTIME_VERSION#v}" >> "$GITHUB_ENV"
          if [ -n "${AI_RUNTIME_RELEASE_TAG}" ]; then
            echo "AI_RUNTIME_RELEASE_TAG=${AI_RUNTIME_RELEASE_TAG}" >> "$GITHUB_ENV"
          else
            echo "AI_RUNTIME_RELEASE_TAG=ai-runtime-v${AI_RUNTIME_VERSION#v}" >> "$GITHUB_ENV"
          fi

      - name: Verify AI runtime release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$AI_RUNTIME_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Using AI runtime release tag: $AI_RUNTIME_RELEASE_TAG"
            exit 0
          fi

          echo "Configured AI runtime release '$AI_RUNTIME_RELEASE_TAG' was not found in ${{ github.repository }}." >&2
          echo "App releases now reuse an existing AI runtime release by default." >&2
          echo "Either run .github/workflows/ai-runtime-release.yml first, or point OPENSTUDIO_AI_RUNTIME_RELEASE_TAG / OPENSTUDIO_AI_RUNTIME_VERSION at an existing runtime release." >&2
          exit 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: dist/windows

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-release
          path: dist/macos

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-release
          path: dist/linux

      - name: Download AI runtime release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/ai-runtime
          echo "AI runtime release assets available on $AI_RUNTIME_RELEASE_TAG:"
          gh release view "$AI_RUNTIME_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name' \
            | sort
          gh release download "$AI_RUNTIME_RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern "OpenStudio-AI-Runtime-windows-base-x64.zip" \
            --pattern "OpenStudio-AI-Runtime-macos-arm64.zip" \
            --pattern "OpenStudio-AI-Runtime-linux-cpu-x64.zip" \
            --dir dist/ai-runtime

      - name: Verify downloaded release assets
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist/windows/OpenStudio-Setup-x64.exe",
            "dist/windows/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip",
            "dist/macos/OpenStudio-macOS.dmg",
            "dist/ai-runtime/OpenStudio-AI-Runtime-windows-base-x64.zip",
            "dist/ai-runtime/OpenStudio-AI-Runtime-macos-arm64.zip",
            "dist/ai-runtime/OpenStudio-AI-Runtime-linux-cpu-x64.zip"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path $file)) {
              Write-Host "Downloaded AI runtime files:"
              if (Test-Path "dist/ai-runtime") {
                Get-ChildItem -Path "dist/ai-runtime" -Recurse | ForEach-Object { Write-Host $_.FullName }
              }
              throw "Required downloaded release asset missing: $file"
            }
          }

      - name: Generate checksums and updater metadata
        shell: pwsh
        run: |
          $tag = "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "v$env:VERSION" }
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $windowsUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/OpenStudio-Setup-x64.exe"
          $macosUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/OpenStudio-macOS.dmg"
          $windowsBaseAiRuntimeUrl = "https://github.com/${{ github.repository }}/releases/download/$env:AI_RUNTIME_RELEASE_TAG/OpenStudio-AI-Runtime-windows-base-x64.zip"
          $macosArm64AiRuntimeUrl = "https://github.com/${{ github.repository }}/releases/download/$env:AI_RUNTIME_RELEASE_TAG/OpenStudio-AI-Runtime-macos-arm64.zip"
          $linuxX64AiRuntimeUrl = "https://github.com/${{ github.repository }}/releases/download/$env:AI_RUNTIME_RELEASE_TAG/OpenStudio-AI-Runtime-linux-cpu-x64.zip"
          $linuxUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/OpenStudio-$env:VERSION-linux-x86_64.AppImage"
          ./tools/generate-release-metadata.ps1 `
            -Version $env:VERSION `
            -Channel stable `
            -ReleasePageUrl $releaseUrl `
            -FullReleaseNotesUrl $releaseUrl `
            -NotesFile $env:RELEASE_NOTES_FILE `
            -WindowsAssetPath "dist/windows/OpenStudio-Setup-x64.exe" `
            -WindowsAssetUrl $windowsUrl `
            -WindowsInstallerArguments "/SP- /NOICONS" `
            -MacAssetPath "dist/macos/OpenStudio-macOS.dmg" `
            -MacAssetUrl $macosUrl `
            -MacMinimumSystemVersion "12.0" `
            -LinuxAssetPath "dist/linux/OpenStudio-$env:VERSION-linux-x86_64.AppImage" `
            -LinuxAssetUrl $linuxUrl `
            -WindowsBaseAiRuntimeAssetPath "dist/ai-runtime/OpenStudio-AI-Runtime-windows-base-x64.zip" `
            -WindowsBaseAiRuntimeAssetUrl $windowsBaseAiRuntimeUrl `
            -WindowsCudaInstallPlanPath "tools/ai-runtime-install-plan-windows-cuda.json" `
            -WindowsDirectmlInstallPlanPath "tools/ai-runtime-install-plan-windows-directml.json" `
            -MacArm64AiRuntimeAssetPath "dist/ai-runtime/OpenStudio-AI-Runtime-macos-arm64.zip" `
            -MacArm64AiRuntimeAssetUrl $macosArm64AiRuntimeUrl `
            -LinuxX64AiRuntimeAssetPath "dist/ai-runtime/OpenStudio-AI-Runtime-linux-cpu-x64.zip" `
            -LinuxX64AiRuntimeAssetUrl $linuxX64AiRuntimeUrl `
            -LinuxCudaInstallPlanPath "tools/ai-runtime-install-plan-linux-cuda.json" `
            -LinuxRocmInstallPlanPath "tools/ai-runtime-install-plan-linux-rocm.json" `
            -AiRuntimeVersion $env:AI_RUNTIME_VERSION

      - name: Validate release metadata
        shell: pwsh
        run: |
          ./tools/validate-release-metadata.ps1 `
            -MetadataDir "dist/release-metadata" `
            -Channel stable `
            -WindowsAssetPath "dist/windows/OpenStudio-Setup-x64.exe" `
            -MacAssetPath "dist/macos/OpenStudio-macOS.dmg" `
            -LinuxAssetPath "dist/linux/OpenStudio-$env:VERSION-linux-x86_64.AppImage" `
            -WindowsBaseAiRuntimeAssetPath "dist/ai-runtime/OpenStudio-AI-Runtime-windows-base-x64.zip" `
            -WindowsCudaInstallPlanPath "tools/ai-runtime-install-plan-windows-cuda.json" `
            -WindowsDirectmlInstallPlanPath "tools/ai-runtime-install-plan-windows-directml.json" `
            -MacArm64AiRuntimeAssetPath "dist/ai-runtime/OpenStudio-AI-Runtime-macos-arm64.zip" `
            -LinuxX64AiRuntimeAssetPath "dist/ai-runtime/OpenStudio-AI-Runtime-linux-cpu-x64.zip" `
            -LinuxCudaInstallPlanPath "tools/ai-runtime-install-plan-linux-cuda.json" `
            -LinuxRocmInstallPlanPath "tools/ai-runtime-install-plan-linux-rocm.json"

      - name: Install updater signing dependency
        run: python3 -m pip install "cryptography==46.0.3"

      - name: Sign application update manifests
        shell: bash
        env:
          OPENSTUDIO_UPDATE_SIGNING_SEED: ${{ secrets.OPENSTUDIO_UPDATE_SIGNING_SEED }}
        run: |
          if [ -z "$OPENSTUDIO_UPDATE_SIGNING_SEED" ]; then
            echo "OPENSTUDIO_UPDATE_SIGNING_SEED is required for authenticated app updates." >&2
            exit 1
          fi
          python3 tools/updater_manifest.py sign --metadata-dir dist/release-metadata

      - name: Prepare uniquely named release metadata assets
        shell: pwsh
        run: |
          ./tools/prepare-release-publish-assets.ps1 `
            -MetadataDir "dist/release-metadata" `
            -OutputDir "dist/release-publish-assets"

      - name: Add FFmpeg source archive to release checksums
        shell: pwsh
        run: |
          $sourcePath = "dist/windows/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip"
          $checksumsPath = "dist/release-publish-assets/OpenStudio-checksums.txt"
          $sourceHash = (Get-FileHash -LiteralPath $sourcePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sourceHash  OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip" |
            Add-Content -LiteralPath $checksumsPath -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: OpenStudio ${{ env.VERSION }}
          body_path: ${{ env.RELEASE_NOTES_FILE }}
          fail_on_unmatched_files: true
          files: |
            dist/windows/OpenStudio-Setup-x64.exe
            dist/windows/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip
            dist/macos/OpenStudio-macOS.dmg
            dist/linux/OpenStudio-*-linux-x86_64.AppImage
            dist/release-publish-assets/OpenStudio-checksums.txt
            dist/release-publish-assets/OpenStudio-release-latest.json
            dist/release-publish-assets/OpenStudio-release-stable-latest.json
            dist/release-publish-assets/OpenStudio-ai-runtime-latest.json
            dist/release-publish-assets/OpenStudio-ai-runtime-stable-latest.json
            dist/release-publish-assets/OpenStudio-appcast-windows-stable.xml
            dist/release-publish-assets/OpenStudio-appcast-macos-stable.xml
            dist/release-publish-assets/OpenStudio-appcast-linux-stable.xml

      - name: Verify website dispatch configuration
        shell: bash
        env:
          WEBSITE_DISPATCH_TOKEN: ${{ secrets.OPENSTUDIO_WEBSITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$WEBSITE_DISPATCH_TOKEN" ]; then
            echo "OPENSTUDIO_WEBSITE_DISPATCH_TOKEN is required so the website repo can publish release metadata." >&2
            exit 1
          fi

      - name: Trigger website release publish
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.OPENSTUDIO_WEBSITE_DISPATCH_TOKEN }}
          repository: ${{ env.WEBSITE_REPO }}
          event-type: ${{ env.WEBSITE_DISPATCH_EVENT_TYPE }}
          client-payload: >-
            {"tag":"${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', github.event.inputs.version) }}","channel":"stable","desktopRepo":"${{ github.repository }}"}

  submit-store:
    name: Submit Microsoft Store release
    needs: [publish, build-windows, validate-release-notes]
    if: vars.OPENSTUDIO_STORE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: microsoft-store
    concurrency:
      group: openstudio-microsoft-store-submission
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      RELEASE_NOTES_FILE: ${{ needs.validate-release-notes.outputs.notes_file }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: microsoft-store-package
          path: dist/store

      - name: Require the exact release tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "v${VERSION#v}" ]; then
            echo "Store submission requires the workflow version to match its tag." >&2
            exit 1
          fi

      - name: Verify Store API access and draft without mutations
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: >-
          python3 tools/submit_store_release.py --version "$VERSION"
          --package-dir dist/store --notes-file "$RELEASE_NOTES_FILE"
          --initial-submission-config packaging/msix/initial-submission.json
          --report output/store-preflight.json --preflight

      - name: Submit the exact release package and notes
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: >-
          python3 tools/submit_store_release.py --version "$VERSION"
          --package-dir dist/store --notes-file "$RELEASE_NOTES_FILE"
          --initial-submission-config packaging/msix/initial-submission.json
          --report output/store-submission.json --submit

      - name: Retain sanitized submission status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-submission-${{ github.run_attempt }}
          path: |
            output/store-preflight.json
            output/store-submission.json
          if-no-files-found: warn
          retention-days: 30

name: FFmpeg Runtime

on:
  push:
    branches:
      - main
    tags:
      - "ffmpeg-runtime-v*"
    paths:
      - ".github/workflows/ffmpeg-runtime.yml"
      - "thirdparty/ffmpeg/**"
      - "tools/build-windows-ffmpeg-runtime.sh"
      - "tools/test-windows-ffmpeg-runtime.ps1"
      - "tools/build-windows-ffmpeg-runtime-native.py"
      - "tools/build-windows-ffmpeg-runtime-native.sh"
      - "tools/package_ffmpeg_runtime.py"
      - "tools/validate-release-notes.py"
      - "docs/releases/ffmpeg-runtime-*.md"
  pull_request:
    paths:
      - ".github/workflows/ffmpeg-runtime.yml"
      - "thirdparty/ffmpeg/**"
      - "tools/build-windows-ffmpeg-runtime.sh"
      - "tools/test-windows-ffmpeg-runtime.ps1"
      - "tools/build-windows-ffmpeg-runtime-native.py"
      - "tools/build-windows-ffmpeg-runtime-native.sh"
      - "tools/package_ffmpeg_runtime.py"
      - "tools/validate-release-notes.py"
      - "docs/releases/ffmpeg-runtime-*.md"
  workflow_dispatch:
    inputs:
      qa_tag:
        description: Private draft holding the local qualification input
        required: false
        type: string
      input_sha256:
        description: SHA256 of video-runtime-windows-qualification.zip
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.qa_tag == '' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate reviewed runtime release notes and tag
        env:
          RUNTIME_TAG: ${{ github.ref_name }}
          IS_RUNTIME_TAG: ${{ startsWith(github.ref, 'refs/tags/ffmpeg-runtime-v') }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          with open('thirdparty/ffmpeg/source-lock.json') as source:
              version = json.load(source)['runtimeVersion']
          subprocess.run(['python3','tools/validate-release-notes.py','--runtime-version',version],check=True)
          if os.environ['IS_RUNTIME_TAG'] == 'true' and os.environ['RUNTIME_TAG'] != 'ffmpeg-runtime-v' + version:
              raise SystemExit('Runtime tag does not match the reviewed source version.')
          PY

      - name: Install deterministic build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl pkg-config python3 tar xz-utils zip

      - name: Build runtime and complete corresponding source
        run: bash ./tools/build-windows-ffmpeg-runtime.sh

      - name: Rebuild from the complete corresponding-source archive
        run: |
          rm -rf "$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild"
          mkdir -p "$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild/source"
          unzip -q \
            dist/ffmpeg-runtime/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip \
            -d "$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild/source"
          OPENSTUDIO_FFMPEG_WORK_ROOT="$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild/work" \
          OPENSTUDIO_FFMPEG_OUTPUT_ROOT="$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild/output" \
            bash "$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild/source/build/build-windows-ffmpeg-runtime.sh"
          python3 - \
            build-ffmpeg-runtime/runtime/runtime-manifest.json \
            "$RUNNER_TEMP/openstudio-ffmpeg-source-rebuild/work/runtime/runtime-manifest.json" <<'PY'
          import json
          import sys

          manifests = []
          for path in sys.argv[1:]:
              with open(path, "r", encoding="utf-8") as handle:
                  manifests.append(json.load(handle))
          for key in ("runtimeVersion", "target", "license", "gplComponentsEnabled", "nonFreeComponentsEnabled"):
              if manifests[0][key] != manifests[1][key]:
                  raise SystemExit(f"Rebuilt manifest differs for {key}")
          paths = [{item["path"] for item in manifest["files"]} for manifest in manifests]
          if paths[0] != paths[1]:
              raise SystemExit("Rebuilt runtime file set differs")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-runtime-build
          path: dist/ffmpeg-runtime/
          if-no-files-found: error

  test-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-runtime-build
          path: dist/ffmpeg-runtime

      - name: Run Windows capability and conversion regression
        shell: pwsh
        run: |
          ./tools/test-windows-ffmpeg-runtime.ps1 `
            -RuntimeArchive dist/ffmpeg-runtime/OpenStudio-FFmpeg-8.0.1-windows-x64.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/ffmpeg-runtime-v')
    needs: test-windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ffmpeg-runtime-build
          path: dist/ffmpeg-runtime

      - name: Publish immutable FFmpeg runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "OpenStudio FFmpeg Runtime ${GITHUB_REF_NAME#ffmpeg-runtime-v}" \
            --notes-file "docs/releases/ffmpeg-runtime-${GITHUB_REF_NAME#ffmpeg-runtime-v}.md" \
            --latest=false \
            dist/ffmpeg-runtime/OpenStudio-FFmpeg-8.0.1-windows-x64.zip \
            dist/ffmpeg-runtime/OpenStudio-FFmpeg-8.0.1-complete-corresponding-source.zip \
            dist/ffmpeg-runtime/SHA256SUMS.txt

  installed-windows:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qa_tag != '' }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch and verify private qualification input
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QA_TAG: ${{ inputs.qa_tag }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          if ($env:QA_TAG -notmatch '^qa-video-runtime-[0-9]{8}-[0-9]+$') { throw 'Invalid qualification tag.' }
          if ($env:INPUT_SHA256 -notmatch '^[a-f0-9]{64}$') { throw 'Invalid input hash.' }
          gh release view $env:QA_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft | Set-Variable draft
          if ($LASTEXITCODE -ne 0 -or $draft -ne 'true') { throw 'Qualification input must remain a private draft.' }
          gh release download $env:QA_TAG --repo $env:GITHUB_REPOSITORY --pattern video-runtime-windows-qualification.zip --dir input
          if ($LASTEXITCODE -ne 0) { throw 'Qualification download failed.' }
          $zip = 'input/video-runtime-windows-qualification.zip'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:INPUT_SHA256) { throw 'Input checksum mismatch.' }
          Expand-Archive -LiteralPath $zip -DestinationPath qualification
          python qualification/tools/verify-video-qualification-input.py qualification
          if ($LASTEXITCODE -ne 0) { throw 'Qualification file hashes failed.' }
      - name: Install packaging prerequisite
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
      - name: Package, install, test and uninstall Release candidate
        shell: pwsh
        run: |
          ./qualification/tools/test-video-installed-release.ps1 -QualificationRoot qualification
      - name: Retain qualification evidence and installer
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-runtime-installed-windows-evidence
          path: |
            qualification/evidence/
            qualification/dist/windows/
          if-no-files-found: warn
          retention-days: 14
